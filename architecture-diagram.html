<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NamedPay architecture — pay an agent by its .ai name</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>NamedPay — pay an agent by its .ai name</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="namedpay-architecture-title namedpay-architecture-desc">
        <title id="namedpay-architecture-title">NamedPay architecture</title>
        <desc id="namedpay-architecture-desc">A payer agent pays a named agent on BNB Chain: the NamedPay contract resolves the .ai name on-chain through the SPACE ID Agent ID contract and forwards BNB directly or via escrow.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="48" width="200" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="86" y="52" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="124" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">ACTORS &amp; PAGE</text>

        <rect x="264" y="48" width="400" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="410" y="52" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">BNB CHAIN · CHAIN 56</text>

        <rect x="704" y="48" width="236" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="774" y="52" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="822" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">RECEIVES &amp; PROVES</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- 1 REGISTER: claim page -> NamedPay -->
        <path d="M 200,108 H 272 Q 280,108 280,116 V 196 Q 280,204 288,204 H 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="290" y="149" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="318" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

        <!-- 2 PAY BY NAME: payer -> NamedPay (headline path, accent) -->
        <line x1="200" y1="228" x2="360" y2="228" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="244" y="208" width="72" height="14" rx="2" fill="#f5f5f5"/>
        <text x="280" y="218" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAY BY NAME</text>

        <!-- 3 RESOLVE: NamedPay -> Agent ID -->
        <line x1="440" y1="240" x2="440" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="448" y="252" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="474" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE</text>

        <!-- 4 OWNER: Agent ID -> NamedPay (dashed return) -->
        <line x1="472" y1="296" x2="472" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="480" y="274" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="500" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OWNER</text>

        <!-- 5 LOCK: NamedPay -> Escrow -->
        <path d="M 568,188 H 592 Q 600,188 600,196 V 412 Q 600,420 592,420 H 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="608" y="296" width="36" height="14" rx="2" fill="#f5f5f5"/>
        <text x="626" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOCK</text>

        <!-- 6 FORWARD BNB: NamedPay -> Payee (headline path, accent) -->
        <line x1="568" y1="228" x2="728" y2="228" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="612" y="208" width="72" height="14" rx="2" fill="#f5f5f5"/>
        <text x="648" y="218" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD BNB</text>

        <!-- 7 RELEASE: Escrow -> Payee (confirmDelivery) -->
        <path d="M 568,436 H 792 Q 800,436 800,428 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="808" y="330" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="834" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>

        <!-- 8 EVENTS: NamedPay -> BscScan (dashed) -->
        <path d="M 520,168 V 116 Q 520,108 528,108 H 728" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="596" y="88" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="622" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENTS</text>

        <!-- Nodes -->
        <!-- Claim page -->
        <rect x="48" y="80" width="152" height="56" fill="#f5f5f5"/>
        <rect x="48" y="80" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="60" y="90" width="36" height="14" rx="2" fill="#5a6580"/>
        <text x="78" y="100" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">PAGE</text>
        <text x="60" y="120" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Claim page</text>
        <text x="60" y="132" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">registerPayee · 1 tx</text>

        <!-- Payer agent -->
        <rect x="48" y="200" width="152" height="56" fill="#f5f5f5"/>
        <rect x="48" y="200" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="60" y="210" width="44" height="14" rx="2" fill="#5a6580"/>
        <text x="82" y="220" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">AGENT</text>
        <text x="60" y="240" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Payer agent</text>
        <text x="60" y="252" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">pays by name · BNB</text>

        <!-- NamedPay contract (focal) -->
        <rect x="360" y="168" width="208" height="72" fill="#f5f5f5"/>
        <rect x="360" y="168" width="208" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="372" y="180" width="52" height="14" rx="2" fill="#bf4520"/>
        <text x="398" y="190" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">CONTRACT</text>
        <text x="372" y="214" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">NamedPay</text>
        <text x="372" y="230" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">payByName · escrowByName</text>

        <!-- Agent ID contract -->
        <rect x="360" y="296" width="208" height="64" fill="#f5f5f5"/>
        <rect x="360" y="296" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="372" y="306" width="48" height="14" rx="2" fill="#4f5d75"/>
        <text x="396" y="316" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">ERC-721</text>
        <text x="372" y="340" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Agent ID</text>
        <text x="372" y="354" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">SPACE ID · 0x60B9..022F</text>

        <!-- Escrow state -->
        <rect x="360" y="392" width="208" height="56" fill="#f5f5f5"/>
        <rect x="360" y="392" width="208" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="372" y="402" width="44" height="14" rx="2" fill="#4f5d75"/>
        <text x="394" y="412" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">STATE</text>
        <text x="372" y="432" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Escrow state</text>
        <text x="372" y="444" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">7-day timeout · refund</text>

        <!-- Named agent (payee) -->
        <rect x="728" y="200" width="184" height="56" fill="#f5f5f5"/>
        <rect x="728" y="200" width="184" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="740" y="210" width="44" height="14" rx="2" fill="#5a6580"/>
        <text x="762" y="220" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">AGENT</text>
        <text x="740" y="240" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Named agent</text>
        <text x="740" y="252" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">receives BNB · payout addr</text>

        <!-- BscScan -->
        <rect x="728" y="80" width="184" height="56" fill="#f5f5f5"/>
        <rect x="728" y="80" width="184" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="740" y="90" width="44" height="14" rx="2" fill="#4f5d75"/>
        <text x="762" y="100" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">PROOF</text>
        <text x="740" y="120" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">BscScan</text>
        <text x="740" y="132" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">verified source · events</text>

        <!-- Callout: eligibility -->
        <text x="48" y="336" fill="#2d3142" font-size="12" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Eligibility: 30 distinct</text>
        <text x="48" y="354" fill="#2d3142" font-size="12" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Agent ID addresses must</text>
        <text x="48" y="372" fill="#2d3142" font-size="12" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">interact Nov 18 – Dec 9.</text>

        <!-- Legend -->
        <rect x="24" y="516" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="46" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Agent / page</text>
        <rect x="140" y="516" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="162" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">NamedPay contract</text>
        <rect x="292" y="516" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="314" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">On-chain store</text>
        <line x1="424" y1="522" x2="448" y2="522" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="454" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Flow</text>
        <line x1="500" y1="522" x2="524" y2="522" stroke="#bf4520" stroke-width="1.2"/>
        <text x="530" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Payment path</text>
        <line x1="636" y1="522" x2="660" y2="522" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="666" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Return / async</text>

        <text x="24" y="566" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">NamedPay architecture · Nov 21 2026 · diagram-design default skin (no brand profile set; style-guide gate kept defaults) · testnet 0x644077780140F7E477cb8ecb6a69f4768DB91E4e · tests 33/33 + 3/3</text>
      </svg>
    </div>
  </div>
</body>
</html>
